name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action reads the PR's commit list on pull_request events; without
  # this it crashes with an octokit error (looks like a scan failure, isn't).
  pull-requests: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gateway:
    name: Gateway — typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npx eslint 'src/**/*.ts' --max-warnings=0
      - run: npm run format:check
      - run: npx jest --ci --coverage
        env:
          # Tests mock Redis and queue — no real infra needed.
          # The env var is present so handler tests that probe for a missing
          # WHATSAPP_APP_SECRET can also restore it cleanly.
          WHATSAPP_APP_SECRET: ci-test-secret-not-real
      - run: npm run build
